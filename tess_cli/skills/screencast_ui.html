<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TESS Remote</title>
    <style>
        :root {
            --accent:      #00f2ff;
            --accent-dim:  rgba(0,242,255,0.15);
            --glass-bg:    rgba(18, 18, 18, 0.80);
            --glass-bd:    rgba(255,255,255,0.09);
            --text:        #ffffff;
            --text-dim:    #888888;
            --danger:      rgba(255,60,60,0.25);
            --danger-bd:   rgba(255,60,60,0.4);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #050505;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            touch-action: none;
            color: var(--text);
        }

        /* ── Stream ─────────────────────────────── */
        #screen-wrap {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, #111 0%, #000 100%);
            overflow: hidden;
        }

        #stream {
            max-width: 100%; max-height: 100%;
            object-fit: contain;
            display: block;
            transform-origin: 0 0;
            will-change: transform;
            user-select: none;
            -webkit-user-drag: none;
        }

        #stream.loading { opacity: 0.3; }

        /* ── UI overlay ─────────────────────────── */
        #ui {
            position: fixed; inset: 0;
            pointer-events: none;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        /* ── Top bar ────────────────────────────── */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            pointer-events: auto;
        }

        .pill {
            display: flex; align-items: center; gap: 8px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-bd);
            backdrop-filter: blur(12px);
            padding: 7px 14px; border-radius: 20px;
            font-size: 13px; font-weight: 500;
        }

        .live-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #00e676; box-shadow: 0 0 8px #00e676;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 50% { opacity: 0.4; } }

        .pill-accent { color: var(--accent); font-weight: 700; font-size: 11px; letter-spacing: .08em; }

        .stop-btn {
            background: var(--danger);
            border: 1px solid var(--danger-bd);
            color: #ff6060; font-weight: 600;
            cursor: pointer; border-radius: 20px;
            padding: 7px 14px; font-size: 13px;
            transition: background .2s;
        }
        .stop-btn:active { background: rgba(255,60,60,0.45); }

        /* ── FPS counter ────────────────────────── */
        #fps-counter {
            font-size: 10px; color: var(--accent);
            opacity: 0.6; font-variant-numeric: tabular-nums;
        }

        /* ── Media dock ─────────────────────────── */
        .media-dock {
            position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 14px;
            background: var(--glass-bg); border: 1px solid var(--glass-bd);
            backdrop-filter: blur(14px); border-radius: 14px;
            padding: 12px 8px;
            pointer-events: auto;
        }

        .icon-btn {
            background: none; border: none; color: var(--text);
            font-size: 20px; line-height: 1; cursor: pointer;
            opacity: 0.65; transition: opacity .15s, transform .15s;
            padding: 4px;
        }
        .icon-btn:active { opacity: 1; color: var(--accent); transform: scale(0.88); }

        .divider { height: 1px; background: var(--glass-bd); margin: 2px 4px; }

        /* ── Bottom dock ────────────────────────── */
        .bottom-dock {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            pointer-events: auto;
        }

        /* Quick keys */
        .quick-keys {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
            background: var(--glass-bg); backdrop-filter: blur(14px);
            border: 1px solid var(--glass-bd);
            padding: 8px 12px; border-radius: 16px;
        }

        .chip {
            background: rgba(255,255,255,0.07);
            border: 1px solid var(--glass-bd); color: var(--text);
            padding: 7px 13px; border-radius: 8px;
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: background .15s;
        }
        .chip:active { background: var(--accent); color: #000; border-color: transparent; }

        /* Toolbar */
        .toolbar {
            display: flex; gap: 4px; align-items: center;
            background: var(--glass-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--glass-bd);
            padding: 8px 14px; border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .tool-btn {
            background: none; border: none; font-size: 22px;
            cursor: pointer; padding: 6px 10px; border-radius: 10px;
            opacity: 0.5; transition: opacity .15s, background .15s;
            color: var(--text);
        }
        .tool-btn.active {
            opacity: 1; background: var(--accent-dim);
        }
        .tool-btn:active { opacity: 1; }

        /* Smart type overlay */
        #type-overlay {
            position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
            width: min(84%, 400px);
            background: #1a1a1a; border: 1px solid #333;
            border-radius: 14px; padding: 12px;
            display: none; box-shadow: 0 12px 48px rgba(0,0,0,0.9);
            pointer-events: auto;
        }
        #type-input {
            width: 100%; border: none; background: transparent;
            color: #fff; font-size: 16px; outline: none; padding: 4px;
        }

        /* Ripple */
        .ripple {
            position: fixed; border-radius: 50%;
            width: 40px; height: 40px;
            background: rgba(0,242,255,0.5);
            transform: translate(-50%, -50%) scale(0);
            animation: ripple .45s ease-out forwards;
            pointer-events: none; z-index: 9999;
        }
        @keyframes ripple { to { transform: translate(-50%, -50%) scale(3); opacity: 0; } }
    </style>
</head>
<body>

<div id="screen-wrap">
    <img id="stream" src="/stream.mjpg" alt="Screen" draggable="false" class="loading">
</div>

<div id="ui">
    <!-- Top bar -->
    <div class="top-bar">
        <div class="pill">
            <span class="live-dot"></span>
            <span>TESS Remote</span>
            <span class="pill-accent" id="mode-label">TOUCH</span>
            <span id="fps-counter">-- fps</span>
        </div>
        <button class="stop-btn" onclick="stopShare()">✕ Stop</button>
    </div>

    <!-- Bottom controls -->
    <div class="bottom-dock">
        <div class="quick-keys">
            <button class="chip" onclick="sendKey('win')">⊞ Win</button>
            <button class="chip" onclick="sendKey('alt+tab')">⇄ Switch</button>
            <button class="chip" onclick="sendKey('ctrl+c')">Copy</button>
            <button class="chip" onclick="sendKey('ctrl+v')">Paste</button>
            <button class="chip" onclick="sendKey('space')">Space</button>
            <button class="chip" onclick="sendKey('enter')">Enter</button>
            <button class="chip" onclick="sendKey('esc')">Esc</button>
        </div>

        <div class="toolbar">
            <button class="tool-btn active" id="btn-touch"    onclick="setMode('touch')"   title="Touch / Click">👆</button>
            <button class="tool-btn"        id="btn-trackpad" onclick="setMode('trackpad')" title="Trackpad">🖱️</button>
            <button class="tool-btn"        id="btn-scroll"   onclick="setMode('scroll')"  title="Scroll">↕️</button>
            <button class="tool-btn"        onclick="toggleType()"           title="Keyboard">⌨️</button>
            <button class="tool-btn"        onclick="sendKey('backspace')"   title="Backspace">⌫</button>
        </div>
    </div>
</div>

<!-- Media dock -->
<div class="media-dock">
    <button class="icon-btn" onclick="mediaAction('vol_up')"    title="Vol +">🔊</button>
    <button class="icon-btn" onclick="mediaAction('vol_down')"  title="Vol −">🔉</button>
    <button class="icon-btn" onclick="mediaAction('mute')"      title="Mute">🔇</button>
    <div class="divider"></div>
    <button class="icon-btn" onclick="mediaAction('play_pause')" title="Play/Pause">⏯</button>
    <button class="icon-btn" onclick="mediaAction('prev')"       title="Previous">⏮</button>
    <button class="icon-btn" onclick="mediaAction('next')"       title="Next">⏭</button>
</div>

<!-- Smart Type -->
<div id="type-overlay">
    <form onsubmit="submitType(event)">
        <input type="text" id="type-input" placeholder="Type text and press Enter…" autocomplete="off" autocorrect="off">
    </form>
</div>

<script>
// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
const stream    = document.getElementById('stream');
const wrap      = document.getElementById('screen-wrap');
const fpsEl     = document.getElementById('fps-counter');
const modeLabel = document.getElementById('mode-label');

let mode = 'touch'; // 'touch' | 'trackpad' | 'scroll'

// Zoom / pan transform
let tx = { x: 0, y: 0, k: 1 };

// Active pointer tracking (multi-touch)
const ptrs = new Map(); // pointerId → PointerEvent

// Trackpad state
let lastTrackX = 0, lastTrackY = 0;

// Pinch state
let pinchDist0 = 0;

// Tap detection
let tapStart = null;

// ─────────────────────────────────────────────
// FPS Counter (based on img load events)
// ─────────────────────────────────────────────
let frameTimes = [];
stream.addEventListener('load', () => {
    stream.classList.remove('loading');
    const now = performance.now();
    frameTimes.push(now);
    // Keep last 30 timestamps
    if (frameTimes.length > 30) frameTimes.shift();
    if (frameTimes.length >= 2) {
        const span = now - frameTimes[0];
        const fps  = Math.round((frameTimes.length - 1) / (span / 1000));
        fpsEl.textContent = fps + ' fps';
    }
});

// ─────────────────────────────────────────────
// Zoom (mouse wheel on desktop)
// ─────────────────────────────────────────────
wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const xs = (e.clientX - tx.x) / tx.k;
    const ys = (e.clientY - tx.y) / tx.k;
    tx.k *= e.deltaY < 0 ? 1.1 : (1 / 1.1);
    tx.k  = Math.max(1, Math.min(5, tx.k));
    tx.x  = e.clientX - xs * tx.k;
    tx.y  = e.clientY - ys * tx.k;
    applyTransform();

    // Desktop scroll → remote scroll
    if (mode !== 'touch' || tx.k === 1) {
        const delta = e.deltaY < 0 ? 3 : -3;
        const { rx, ry } = screenCoords(e.clientX, e.clientY);
        post('/input', { type: 'scroll', x: rx, y: ry, delta });
    }
}, { passive: false });

// ─────────────────────────────────────────────
// Pointer Events
// ─────────────────────────────────────────────
wrap.addEventListener('pointerdown', e => {
    wrap.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, e);

    if (ptrs.size === 1) {
        tapStart = { x: e.clientX, y: e.clientY, t: Date.now() };
        lastTrackX = e.clientX;
        lastTrackY = e.clientY;
    } else if (ptrs.size === 2) {
        pinchDist0 = getPinchDist();
    }
});

wrap.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, e);

    // ── Two-finger pinch zoom ─────────────
    if (ptrs.size === 2) {
        const dist = getPinchDist();
        if (pinchDist0 > 0 && Math.abs(dist - pinchDist0) > 2) {
            const [p1, p2] = [...ptrs.values()];
            const cx = (p1.clientX + p2.clientX) / 2;
            const cy = (p1.clientY + p2.clientY) / 2;
            const xs = (cx - tx.x) / tx.k;
            const ys = (cy - tx.y) / tx.k;
            tx.k *= dist / pinchDist0;
            tx.k  = Math.max(1, Math.min(5, tx.k));
            tx.x  = cx - xs * tx.k;
            tx.y  = cy - ys * tx.k;
            applyTransform();
            pinchDist0 = dist;
        }
        return;
    }

    // ── Single finger ────────────────────
    if (ptrs.size !== 1) return;

    if (mode === 'trackpad') {
        const dx = e.clientX - lastTrackX;
        const dy = e.clientY - lastTrackY;
        lastTrackX = e.clientX;
        lastTrackY = e.clientY;
        // Accumulate relative movement and send as absolute position
        const cur = pyautoCurrent();
        const { rx, ry } = screenCoordsAbs(cur.x + dx * 2, cur.y + dy * 2);
        post('/input', { type: 'move', x: rx, y: ry });
    } else if (mode === 'scroll') {
        const dy = e.clientY - lastTrackY;
        lastTrackY = e.clientY;
        if (Math.abs(dy) > 2) {
            const { rx, ry } = screenCoords(e.clientX, e.clientY);
            post('/input', { type: 'scroll', x: rx, y: ry, delta: dy < 0 ? 3 : -3 });
        }
    }
});

wrap.addEventListener('pointerup', e => {
    const had = ptrs.has(e.pointerId);
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinchDist0 = 0;

    if (!had) return;

    // ── Tap detection ────────────────────
    if (ptrs.size === 0 && tapStart) {
        const dt   = Date.now() - tapStart.t;
        const dist = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y);
        if (dt < 400 && dist < 12) {
            handleTap(e);
        }
        tapStart = null;
    }
});

wrap.addEventListener('pointercancel', e => {
    ptrs.delete(e.pointerId);
    tapStart = null;
    pinchDist0 = 0;
});

// ─────────────────────────────────────────────
// Tap / click
// ─────────────────────────────────────────────
function handleTap(e) {
    ripple(e.clientX, e.clientY);
    if (mode === 'touch') {
        const { rx, ry } = screenCoords(e.clientX, e.clientY);
        post('/input', { type: 'click', x: rx, y: ry, button: 'left' });
    } else if (mode === 'trackpad') {
        // Tap in trackpad mode = left click at current cursor
        post('/input', { type: 'click', x: -1, y: -1, button: 'left' });
    }
}

// ─────────────────────────────────────────────
// Coordinate helpers
// ─────────────────────────────────────────────
function screenCoords(cx, cy) {
    const rect = stream.getBoundingClientRect();
    const rx = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
    const ry = Math.max(0, Math.min(1, (cy - rect.top)  / rect.height));
    return { rx, ry };
}

// For trackpad absolute movement (normalised 0-1 of screen)
function screenCoordsAbs(px, py) {
    // px/py are in display pixels relative to the viewer's screen
    const rx = Math.max(0, Math.min(1, px / window.screen.width));
    const ry = Math.max(0, Math.min(1, py / window.screen.height));
    return { rx, ry };
}

// Placeholder: we don't actually know cursor; trackpad uses deltas mapped via move events
let _curX = 0.5, _curY = 0.5;
function pyautoCurrent() { return { x: _curX * window.innerWidth, y: _curY * window.innerHeight }; }

function getPinchDist() {
    const vals = [...ptrs.values()];
    return Math.hypot(vals[0].clientX - vals[1].clientX, vals[0].clientY - vals[1].clientY);
}

// ─────────────────────────────────────────────
// Transform
// ─────────────────────────────────────────────
function applyTransform() {
    stream.style.transform = `translate(${tx.x}px, ${tx.y}px) scale(${tx.k})`;
}

// ─────────────────────────────────────────────
// Mode
// ─────────────────────────────────────────────
function setMode(m) {
    mode = m;
    modeLabel.textContent = m.toUpperCase();
    document.getElementById('btn-touch').classList.toggle('active',    m === 'touch');
    document.getElementById('btn-trackpad').classList.toggle('active', m === 'trackpad');
    document.getElementById('btn-scroll').classList.toggle('active',   m === 'scroll');
    wrap.style.cursor = m === 'trackpad' ? 'none' : 'default';
}

// ─────────────────────────────────────────────
// Network helpers
// ─────────────────────────────────────────────
function post(endpoint, body) {
    fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    }).catch(() => {});
}

function sendKey(key) {
    post('/input', { type: 'key', key });
}

function mediaAction(action) {
    post('/input', { type: 'media', action });
}

// ─────────────────────────────────────────────
// Smart Type
// ─────────────────────────────────────────────
function toggleType() {
    const el = document.getElementById('type-overlay');
    const vis = el.style.display === 'block';
    el.style.display = vis ? 'none' : 'block';
    if (!vis) document.getElementById('type-input').focus();
}

function submitType(e) {
    e.preventDefault();
    const input = document.getElementById('type-input');
    const val = input.value.trim();
    if (val) post('/input', { type: 'text', text: val });
    input.value = '';
    toggleType();
}

// ─────────────────────────────────────────────
// Ripple
// ─────────────────────────────────────────────
function ripple(x, y) {
    const el = document.createElement('div');
    el.className = 'ripple';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
}

// ─────────────────────────────────────────────
// Stop
// ─────────────────────────────────────────────
function stopShare() {
    if (confirm('Stop screen sharing?')) {
        fetch('/stop', { method: 'POST' });
    }
}
</script>
</body>
</html>
